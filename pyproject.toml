[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pediatric-eeg-seizure-v2"
version = "0.1.0"
description = "Patient-independent CHB-MIT seizure detection research"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=1.26,<3", "requests>=2.32,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
data = ["pyedflib>=0.1.40,<0.2"]
train = ["torch>=2.6,<3", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4"]
serve = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "onnxruntime>=1.20,<2"]
export = ["onnx>=1.17,<2", "onnxscript>=0.3,<1", "onnxruntime>=1.20,<2"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
seizure-v2 = "seizure_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires downloaded real CHB-MIT data"]
